services:
  app:
    build:
      context: .
    image: youth-aviation-contest:latest
    container_name: youth-contest-app
    restart: unless-stopped
    env_file:
      - .env
      - .env.instance
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - exports_data:/app/runtime/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  app-init:
    build:
      context: .
    image: youth-aviation-contest:latest
    profiles: ["init"]
    env_file:
      - .env
      - .env.instance
    command: ["sh", "-c", "npm run db:init"]

volumes:
  exports_data:
