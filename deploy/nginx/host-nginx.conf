user www-data;
worker_processes auto;
worker_rlimit_nofile 200000;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    use epoll;
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format youth_main '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time ua="$upstream_addr" uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log youth_main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 4096;
    server_tokens off;

    upstream youth_contest_app {
        least_conn;
        server 127.0.0.1:3001;
        keepalive 64;
    }

    server {
        listen 3000 reuseport backlog=8192 default_server;
        server_name _;

        client_max_body_size 128m;

        location /healthz {
            proxy_pass http://youth_contest_app/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://youth_contest_app;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
